<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin - Absensi KKN</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style media="print">
  body * { visibility: hidden; }
  #print-area, #print-area * { visibility: visible; }
  #print-area {
    position: absolute; top: 0; left: 0; width: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
</style>
</head>
<body class="min-h-screen bg-gray-100">

  <!-- LOGIN -->
  <div id="login-view" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-sm">
      <h1 class="text-xl font-bold text-gray-800 mb-6 text-center">Login Admin</h1>
      <input id="password-input" type="password" placeholder="Password admin"
             class="w-full border border-gray-300 rounded-lg px-4 py-3 mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      <button id="login-btn"
              class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition">
        Masuk
      </button>
      <p id="login-error" class="text-red-600 text-sm mt-3 text-center hidden">Password salah.</p>
      <a href="index.html" class="block text-center text-gray-400 text-sm mt-6">&larr; Kembali</a>
    </div>
  </div>

  <!-- DASHBOARD SHELL -->
  <div id="dashboard-view" class="hidden">
    <div class="flex flex-col md:flex-row min-h-screen">

      <!-- SIDEBAR -->
      <aside class="bg-slate-900 text-slate-300 w-full md:w-64 md:min-h-screen flex flex-col">
        <div class="p-5 border-b border-slate-800">
          <p class="text-white font-bold text-lg">Absensi KKN</p>
          <p class="text-xs text-slate-400">Panel Admin</p>
        </div>
        <nav class="flex md:flex-col flex-1 overflow-x-auto">
          <button data-section="dashboard" class="nav-btn flex-1 md:flex-none text-left px-5 py-3 hover:bg-slate-800 transition border-l-4 border-transparent whitespace-nowrap">
            📊 Dashboard
          </button>
          <button data-section="peserta" class="nav-btn flex-1 md:flex-none text-left px-5 py-3 hover:bg-slate-800 transition border-l-4 border-transparent whitespace-nowrap">
            👥 Kelola Peserta
          </button>
          <button data-section="qr" class="nav-btn flex-1 md:flex-none text-left px-5 py-3 hover:bg-slate-800 transition border-l-4 border-transparent whitespace-nowrap">
            🔳 QR Hari Ini
          </button>
          <button data-section="rekap" class="nav-btn flex-1 md:flex-none text-left px-5 py-3 hover:bg-slate-800 transition border-l-4 border-transparent whitespace-nowrap">
            🗓️ Rekap Kehadiran
          </button>
        </nav>
        <div class="p-5 border-t border-slate-800">
          <button id="logout-btn" class="text-sm text-slate-400 hover:text-red-400">Keluar</button>
        </div>
      </aside>

      <!-- MAIN CONTENT -->
      <main class="flex-1 p-4 md:p-8 max-w-5xl w-full">

        <!-- Dashboard -->
        <section id="section-dashboard" class="section-panel space-y-4">
          <h1 class="text-2xl font-bold text-gray-800">Dashboard</h1>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-white rounded-2xl shadow p-5">
              <p class="text-sm text-gray-500">Total Peserta</p>
              <p id="stat-total" class="text-3xl font-bold text-gray-800 mt-1">-</p>
            </div>
            <div class="bg-white rounded-2xl shadow p-5">
              <p class="text-sm text-gray-500">Hadir Hari Ini</p>
              <p id="stat-hadir" class="text-3xl font-bold text-green-600 mt-1">-</p>
            </div>
            <div class="bg-white rounded-2xl shadow p-5">
              <p class="text-sm text-gray-500">Belum Hadir</p>
              <p id="stat-belum" class="text-3xl font-bold text-amber-500 mt-1">-</p>
            </div>
          </div>
        </section>

        <!-- Kelola Peserta -->
        <section id="section-peserta" class="section-panel hidden space-y-4">
          <div class="flex items-center justify-between flex-wrap gap-3">
            <h1 class="text-2xl font-bold text-gray-800">Kelola Peserta</h1>
            <button id="show-add-peserta-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-2 rounded-lg transition">
              + Tambah Peserta
            </button>
          </div>

          <div id="add-peserta-form" class="hidden bg-white rounded-2xl shadow p-5 space-y-3">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <input id="new-nim" type="text" placeholder="NIM"
                     class="border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
              <input id="new-nama" type="text" placeholder="Nama"
                     class="border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
              <input id="new-password" type="text" placeholder="Password"
                     class="border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>
            <div class="flex gap-3">
              <button id="save-new-peserta-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-2 rounded-lg transition">Simpan</button>
              <button id="cancel-new-peserta-btn" class="bg-gray-100 hover:bg-gray-200 text-gray-600 font-semibold px-4 py-2 rounded-lg transition">Batal</button>
            </div>
          </div>

          <div class="bg-white rounded-2xl shadow p-6 overflow-x-auto">
            <table class="w-full text-sm text-left">
              <thead>
                <tr class="border-b border-gray-200 text-gray-500">
                  <th class="py-2 pr-4">NIM</th>
                  <th class="py-2 pr-4">Nama</th>
                  <th class="py-2 pr-4">Password</th>
                  <th class="py-2 pr-4">Aksi</th>
                </tr>
              </thead>
              <tbody id="peserta-body"></tbody>
            </table>
          </div>
        </section>

        <!-- QR Hari Ini -->
        <section id="section-qr" class="section-panel hidden space-y-4">
          <h1 class="text-2xl font-bold text-gray-800">QR Absen Hari Ini</h1>
          <div class="bg-white rounded-2xl shadow p-6">
            <button id="generate-btn"
                    class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-5 py-2.5 rounded-lg transition">
              Tampilkan / Buat QR Hari Ini
            </button>

            <div id="qr-result" class="hidden mt-6 flex flex-col items-center">
              <div id="print-area" class="flex flex-col items-center gap-2">
                <p class="text-sm text-gray-500">ABSENSI KKN</p>
                <p id="qr-tanggal" class="text-xl font-bold text-gray-800"></p>
                <div id="qr-canvas"></div>
                <p class="text-sm text-gray-400">Scan QR ini untuk mengisi absensi hari ini</p>
              </div>
              <button id="print-btn"
                      class="mt-6 bg-gray-800 hover:bg-black text-white font-semibold px-5 py-2.5 rounded-lg transition">
                🖨️ Cetak QR
              </button>
            </div>
          </div>
        </section>

        <!-- Rekap Kehadiran -->
        <section id="section-rekap" class="section-panel hidden space-y-4">
          <h1 class="text-2xl font-bold text-gray-800">Rekap Kehadiran</h1>
          <div class="bg-white rounded-2xl shadow p-6">
            <div class="flex flex-wrap gap-3 mb-4">
              <input id="rekap-tanggal" type="date"
                     class="border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
              <button id="rekap-btn"
                      class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-2 rounded-lg transition">
                Muat Rekap
              </button>
            </div>
            <p id="rekap-summary" class="text-sm text-gray-500 mb-3"></p>
            <div class="overflow-x-auto">
              <table class="w-full text-sm text-left">
                <thead>
                  <tr class="border-b border-gray-200 text-gray-500">
                    <th class="py-2 pr-4">NIM</th>
                    <th class="py-2 pr-4">Nama</th>
                    <th class="py-2 pr-4">Status</th>
                    <th class="py-2 pr-4">Waktu</th>
                  </tr>
                </thead>
                <tbody id="rekap-body"></tbody>
              </table>
            </div>
          </div>
        </section>

      </main>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
