<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Absen - Scan QR</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body class="min-h-screen bg-gray-100">

  <!-- LOGIN PESERTA -->
  <div id="identify-view" class="hidden min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-sm">
      <h1 class="text-xl font-bold text-gray-800 mb-1 text-center">Absensi KKN</h1>
      <p class="text-sm text-gray-400 mb-6 text-center">Login Peserta</p>

      <label class="block text-sm text-gray-600 mb-1">NIM</label>
      <input id="nim-input" type="text" placeholder="Masukkan NIM"
             class="w-full border border-gray-300 rounded-lg px-4 py-3 mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      <label class="block text-sm text-gray-600 mb-1">Password</label>
      <input id="password-input" type="password" placeholder="Masukkan password"
             class="w-full border border-gray-300 rounded-lg px-4 py-3 mb-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      <p class="text-xs text-gray-400 mb-4">Gunakan NIM &amp; password yang sudah diberikan admin. Setelah berhasil login, HP ini akan mengingat kamu untuk kunjungan berikutnya.</p>
      <button id="lanjut-btn"
              class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition">
        Masuk
      </button>
      <p id="login-error" class="text-red-600 text-sm mt-3 text-center hidden"></p>
      <a href="index.html" class="block text-center text-gray-400 text-sm mt-6">&larr; Kembali</a>
    </div>
  </div>

  <!-- MAIN (setelah login) -->
  <div id="main-view" class="hidden min-h-screen">
    <header class="bg-slate-900 text-white px-4 py-4 flex items-center justify-between flex-wrap gap-2">
      <div>
        <p class="font-bold">Absensi KKN</p>
        <p class="text-xs text-slate-400">Login sebagai <span id="identity-name" class="text-slate-200 font-medium"></span></p>
      </div>
      <button class="change-identity-btn text-xs text-slate-400 hover:text-red-400 border border-slate-700 rounded-lg px-3 py-1.5">
        Ganti Akun
      </button>
    </header>

    <main class="max-w-sm mx-auto p-4">
      <div class="flex mb-4 rounded-lg bg-gray-200/70 p-1">
        <button data-tab="absen" class="tab-btn flex-1 py-2 rounded-md font-medium text-sm transition">📷 Absen</button>
        <button data-tab="laporan" class="tab-btn flex-1 py-2 rounded-md font-medium text-sm transition">📄 Laporan</button>
      </div>

      <!-- TAB ABSEN -->
      <div id="tab-absen" class="tab-panel">
        <div class="bg-white rounded-2xl shadow p-4">
          <div id="scan-view">
            <div id="qr-reader" class="rounded-xl overflow-hidden"></div>
            <p class="text-center text-gray-400 text-sm mt-3">Arahkan kamera ke QR absensi</p>
          </div>

          <div id="result-view" class="hidden text-center py-4">
            <p id="result-icon" class="text-5xl mb-3"></p>
            <p id="result-message" class="text-gray-700 font-medium mb-6"></p>
            <button id="reset-btn"
                    class="w-full bg-gray-800 hover:bg-black text-white font-semibold py-3 rounded-lg transition">
              Scan Lagi
            </button>
          </div>
        </div>
      </div>

      <!-- TAB LAPORAN -->
      <div id="tab-laporan" class="tab-panel hidden space-y-4">
        <div class="bg-white rounded-2xl shadow p-5 space-y-3">
          <div>
            <label class="block text-sm text-gray-600 mb-1">Judul / Keterangan</label>
            <input id="laporan-judul" type="text" placeholder="Contoh: Laporan Mingguan ke-1"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          </div>
          <div>
            <label class="block text-sm text-gray-600 mb-1">File</label>
            <input id="laporan-file" type="file" class="w-full text-sm" />
          </div>
          <button id="upload-laporan-btn"
                  class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition">
            Upload Laporan
          </button>
          <p id="upload-status" class="text-sm text-center hidden"></p>
        </div>

        <div class="bg-white rounded-2xl shadow p-5">
          <p class="text-sm font-semibold text-gray-600 mb-3">Semua Laporan</p>
          <div id="laporan-list" class="space-y-2 max-h-80 overflow-y-auto"></div>
        </div>
      </div>

      <a href="index.html" class="block text-center text-gray-400 text-sm mt-6">&larr; Kembali ke Menu</a>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/scan.js"></script>
</body>
</html>
